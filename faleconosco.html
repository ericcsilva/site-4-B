<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>

    <link rel="stylesheet" href="style1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="contato">

        <div class="texto">
            <h1>Fale Conosco</h1>
            <p>Preencha o formulário abaixo</p>
            
        </div>

        <form>
    <div class="input-contato">
        <input type="text" id="nome" name="nome" placeholder=" " required>
        <label for="nome">Nome</label>
    </div>

    <div class="input-contato">
        <input type="email" id="email" name="email" placeholder=" " required>
        <label for="email">E-mail</label>
    </div>

    <div class="input-contato">
        <input type="text" id="assunto" name="assunto" placeholder=" " required>
        <label for="assunto">Assunto</label>
    </div>

    <div class="input-contato textarea-contato">
        <textarea id="mensagem" name="mensagem" rows="1" placeholder=" " required></textarea>
        <label for="mensagem">Mensagem</label>
    </div>

    <button type="submit" class="botaoc">Enviar</button>
</form>
        <div class="outros-contatos">
            <h3>Outras formas de contato</h3>
            <p>E-mail: contato@exemplo.com</p>
            <p>Telefone: (11) 99999-9999</p>
            <p>Endereço: Rua Exemplo, 123 - São Paulo, SP</p>
        </div>

        <div class="façalogin">
            <a href="login.html">Voltar para o login</a>
        </div>

    </div>

</body>
</html>
