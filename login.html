<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configuração dos caracteres da página -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome que aparece na aba do navegador -->
    <title>Login</title>

    <!-- Liga o arquivo HTML ao arquivo CSS -->
    <link rel="stylesheet" href="style1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>


<body>

    <div class="login">

        <h1>Login</h1>
        <h4>Entre na sua conta</h4>

        <div class="caixa-login">
            <form>
                <div class="input-login">
                    <input type="text" id="usuario" name="usuario" placeholder=" " required>
                    <label for="usuario">Usuário</label>
                </div>

                <div class="input-login">
                    <input type="password" id="senha" name="senha" placeholder=" " required>
                    <label for="senha">Senha</label>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>

        <a href="esqueci.html" class="link-senha">Esqueci minha senha</a>
        <a href="cadastro.html" class="btn-cadastro">Primeira vez por aqui?</a>

    </div> <!-- fecha .login -->

</body>

</html>
